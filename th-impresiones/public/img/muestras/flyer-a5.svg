      <circle cx="120" cy="205" r="20"/><circle cx="184" cy="205" r="20"/>
      <path d="M120 205 L144 176 L176 176 L184 205 M144 176 L158 205 L120 205 M158 205 L176 176 M176 176 L172 166 L182 166 M144 176 L140 168 L150 168"/>
