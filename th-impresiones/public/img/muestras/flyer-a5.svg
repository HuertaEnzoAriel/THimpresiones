<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Dos flyers: uno amarillo con la palabra service y una bicicleta, otro celeste detrás con círculos">
  <g transform="rotate(8 260 160)">
    <rect x="190" y="46" width="150" height="212" fill="#000" opacity=".14"/>
    <rect x="185" y="40" width="150" height="212" fill="#3A9AC2"/>
    <circle cx="262" cy="118" r="34" fill="#A33678"/>
    <circle cx="288" cy="140" r="34" fill="#EFBE41" style="mix-blend-mode:multiply"/>
    <text x="200" y="62" font-family="Consolas, Menlo, monospace" font-weight="500" font-size="7.5" letter-spacing="2" fill="#16244F">CLASE ABIERTA</text>
